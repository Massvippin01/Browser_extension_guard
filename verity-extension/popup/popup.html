<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verity — Web Protection</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <div class="header-logo">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <h1 class="app-title">Verity</h1>
    </div>
    <p class="app-domain" id="app-domain-text">Loading...</p>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Loading State -->
    <div id="loading-state" class="state-container">
      <div class="spinner-ring"></div>
      <p class="state-label">Analyzing page...</p>
    </div>

    <!-- Verdict State -->
    <div id="verdict-state" class="state-container hidden">

      <!-- Status Badge -->
      <div class="status-badge-wrapper">
        <div class="status-ring" id="status-ring">
          <div class="status-icon-inner" id="verdict-icon"></div>
        </div>
        <h2 class="verdict-title" id="verdict-title">—</h2>
      </div>

      <!-- Risk Score -->
      <div class="score-section">
        <div class="score-label">Risk Score</div>
        <div class="score-value-row">
          <span class="score-number" id="risk-score-value">0</span>
          <span class="score-max">/ 100</span>
        </div>
        <div class="score-bar-track">
          <div class="score-bar-fill" id="score-bar-fill"></div>
        </div>
        <p class="score-desc" id="risk-score-text">Analyzing...</p>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Signals -->
      <div class="signals-section" id="reasons-container">
        <h3 class="signals-header">Detected Signals</h3>
        <ul class="signals-list" id="reasons-list"></ul>
        <p class="no-signals" id="no-reasons-msg">✓ No suspicious signals detected.</p>
      </div>

    </div>

    <!-- Error State -->
    <div id="error-state" class="state-container hidden">
      <div class="error-icon">?</div>
      <p class="state-label" id="error-msg">No data available for this page.</p>
    </div>

  </div>

  <!-- Footer -->
  <div class="app-footer">
    <span class="footer-text">Verity Web Protection</span>
    <span class="footer-dot">•</span>
    <span class="footer-text">On-device ML</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
